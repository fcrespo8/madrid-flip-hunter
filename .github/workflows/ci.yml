name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Misma versión mayor que producción y docker-compose (18), con pgvector: la migración
        # de neighborhood_docs hace CREATE EXTENSION vector.
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: flipuser
          POSTGRES_PASSWORD: flippass
          POSTGRES_DB: flip_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flipuser -d flip_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://flipuser:flippass@localhost:5432/flip_test
      ANTHROPIC_API_KEY: test-key

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry==2.3.2

      - name: Install dependencies
        run: poetry install --with dev --no-root

      - name: Lint with ruff
        run: poetry run ruff check backend/

      - name: Migrate test DB
        run: poetry run alembic upgrade head
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Run tests
        run: poetry run pytest tests/ -v -rs
